name: CI

on:
  push:
  pull_request:

jobs:
  pg-parity:
    name: PostgreSQL portability & append-only parity (SRV-01/SRV-02)
    runs-on: ubuntu-latest

    # Throwaway, non-secret credential for an ephemeral CI container ONLY
    # (T-26-02): never a production secret, never referenced from repo secrets.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev

      - name: SQLite suite (no DATABASE_URL — PG parity tests auto-skip)
        run: uv run pytest

      - name: PostgreSQL parity (SRV-01 full history + SRV-02 append-only)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: uv run pytest tests/test_pg_parity.py -x

      - name: PostgreSQL merge portability (SYNC-02/04/05 one engine, both dialects)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: uv run pytest tests/test_merge_pg.py -x

  release-verify:
    name: minisign sign->verify round-trip + tamper-fail (PKG-05, T-31-03)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev

      # Install the official jedisct1 minisign so the sign->verify round-trip in
      # tests/test_release_verify.py RUNS instead of self-skipping (it skips only
      # when the binary is absent — mirrors the DATABASE_URL-absent PG auto-skip).
      # The round-trip uses a THROWAWAY keypair generated per run in tmp; the
      # production offline secret key never enters CI (T-31-02 / T-31-SC).
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      # This closes PKG-05's verify-mechanism proof: sign a manifest, verify it
      # passes, tamper it, assert verify FAILS (T-31-03) — the same primitive
      # Phase 32's self-update runs before unpacking.
      - name: Release-verify (manifest/tamper/version + minisign round-trip)
        run: uv run pytest tests/test_release_verify.py -x
